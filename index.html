const THEME_COLOR = { light: '#ffffff', gray: '#d8d8dc', dark: '#000000' };
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));
  try { localStorage.setItem('dh-theme', t); } catch (e) {}
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', THEME_COLOR[t] || '#000000');
}
{

  document.querySelectorAll('.tbtn').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.theme)));
  applyTheme(initial);
}

  if (checked.length > 5) { input.checked = false; showToast('Максимум 5 карточек'); return; }
  checked.forEach(inp => inp.closest('.fav-item').classList.toggle('selected', inp.checked));
});
$('favShare').addEventListener('click', shareFavorites);
async function shareFavorites() {
  const ids = [...$('favList').querySelectorAll('.pick-input:checked')].slice(0, 5).map(i => i.dataset.id);
  if (!ids.length) { showToast('Отметьте точки — какие карточки отправить'); return; }
  const favs = ids.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
  const origin = location.origin;
  const cards = favs.map((p, i) => {
    const photos = (p.images || []).map(img => (img.startsWith('http') ? img : origin + '/' + img)).join('\n');
    const sizesLine = p.sizes && p.sizes.length ? '\nРазмеры: ' + p.sizes.join(', ') : '';
    return `${i + 1}. ${p.title || p.id} (арт. ${p.article})\nЦена: ${fmtPrice(p.price)}${sizesLine}\n${photos}`;
  }).join('\n\n');
  const text = `🧥 Detsky Hit — мой список\n${cards}`;
  try {
    if (navigator.share) { await navigator.share({ title: 'Detsky Hit', text }); return; }
  } catch (err) { /* пользователь закрыл окно или браузер не поддерживает */ }
  // fallback: выделение текста + execCommand
  const box = document.createElement('textarea');
  box.value = text;
  box.readOnly = true;
  box.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(box);
  box.focus(); box.select(); box.setSelectionRange(0, 99999);
  try {
    const ok = document.execCommand('copy');
    showToast(ok ? 'Список скопирован' : 'Выделите текст в окне');
  } catch (e3) {
    showToast('Не получилось поделиться');
  }
  document.body.removeChild(box);
}
