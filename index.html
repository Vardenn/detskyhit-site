    const moreBtn = descWrap.querySelector('.ph-desc-more');
    const updateMoreBtnLabel = () => { moreBtn.textContent = descWrap.classList.contains('open') ? 'Свернуть' : '… ещё'; };
    moreBtn.addEventListener('click', () => { descWrap.classList.toggle('open'); updateMoreBtnLabel(); });
    requestAnimationFrame(() => {
      if (desc && (desc.scrollHeight - desc.clientHeight) > 4) descWrap.classList.add('has-more');
    });
  }
  articleEl.querySelector('.ph-share').addEventListener('click', () => openShareSheet(shareCtxForProduct(p)));
  const sizesRow = articleEl.querySelector('.ph-sizes');
  if (sizesRow) {
    sizesRow.addEventListener('click', e => {
      const chip = e.target.closest('.ph-size'); if (!chip) return;
      sizesRow.querySelectorAll('.ph-size').forEach(c => c.classList.toggle('on', c === chip));
      articleEl.querySelector('.wa-btn').href = makeWaLink();
    });
  }
  const slider = articleEl.querySelector('.car');
  if (slider) {
    const prev = articleEl.querySelector('.car-nav-prev');
    const next = articleEl.querySelector('.car-nav-next');
    const go = dir => {
      const count = slider.children.length; if (!count) return;
      let idx = Math.round(slider.scrollLeft / Math.max(1, slider.clientWidth));
      let to = idx + dir; if (to >= count) to = 0; else if (to < 0) to = count - 1;
      slider.scrollTo({ left: to * slider.clientWidth, behavior: 'smooth' });
    };
    if (prev) prev.addEventListener('click', () => go(-1));
    if (next) next.addEventListener('click', () => go(+1));
    const updateDots = () => {
      const idx = Math.round(slider.scrollLeft / Math.max(1, slider.clientWidth));
      articleEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === idx));
    };
    slider.addEventListener('scroll', updateDots);
    articleEl.querySelectorAll('.dot').forEach((d, i) => {
      d.style.cursor = 'pointer';
      d.addEventListener('click', () => slider.scrollTo({ left: i * slider.clientWidth, behavior: 'smooth' }));
    });
  }
  return articleEl;
}

function renderFeedAround(targetIdx) {
  const postsEl = $('posts');
  postsEl.innerHTML = '';
  feedLoaded = new Set();
  feedList = visibleProducts();
  feedFirst = Math.max(0, targetIdx);
  feedLast = -1;
  const cappedLast = Math.min(feedList.length - 1, feedFirst + VIEW_BATCH - 1);
  for (let i = feedFirst; i <= cappedLast; i++) { postsEl.appendChild(renderPostArticle(feedList[i])); feedLoaded.add(i); }
  feedLast = cappedLast;
  const remaining = feedList.length - (feedLast + 1);
  if (remaining > 0) {
    const spacer = document.createElement('div');
    spacer.className = 'feed-end';
    spacer.id = 'feedEndMarker';
    spacer.textContent = '';
    // rendered only when we reach the true end
  }
}

function feedAppendMore() {
  const postsEl = $('posts');
  const next = feedLast + 1;
  if (next >= feedList.length) return false;
  const end = Math.min(feedList.length - 1, next + VIEW_BATCH - 1);
  for (let i = next; i <= end; i++) { postsEl.appendChild(renderPostArticle(feedList[i])); feedLoaded.add(i); }
  feedLast = end;
  $('feedEndMarker')?.remove();
  if (feedLast === feedList.length - 1) {
    const spacer = document.createElement('div');
    spacer.className = 'feed-end';
    spacer.id = 'feedEndMarker';
    spacer.textContent = '— это всё —';
    postsEl.appendChild(spacer);
  }
  return true;
}

function feedPrependMore() {
  if (feedFirst <= 0) return false;
  const postsEl = $('posts');
  // закрепляем СКРОЛЛ на ТОМ ЖЕ посте, который был первым до вставки
  const anchor = postsEl.querySelector('article.post');
  const anchorTopBefore = anchor ? anchor.getBoundingClientRect().top : 0;
  const start = Math.max(0, feedFirst - VIEW_BATCH);
  for (let i = feedFirst - 1; i >= start; i--) {
    postsEl.insertBefore(renderPostArticle(feedList[i]), anchor);
  }
  feedFirst = start;
  const anchorTopAfter = anchor ? anchor.getBoundingClientRect().top : 0;
  viewer.scrollTop = Math.max(0, viewer.scrollTop + (anchorTopAfter - anchorTopBefore));
  return true;
}

function bindFeedScrollOnce() {
  if (viewer.__feedBound) return;
  viewer.__feedBound = true;
  viewer.addEventListener('scroll', () => {
    const v = viewer;
    const distanceToBottom = v.scrollHeight - v.scrollTop - v.clientHeight;
    if (distanceToBottom < 700) feedAppendMore();
    if (v.scrollTop < 300 && feedFirst > 0 && !v.__prependBusy) {
      // prepend preserving scroll position; compensation happens inside feedPrependMore
      v.__prependBusy = true;
      feedPrependMore();
      requestAnimationFrame(() => { v.__prependBusy = false; });
    }
  }, { passive: true });
}

function openViewer(id) {
  feedList = visibleProducts();
  const targetIdx = Math.max(0, feedList.findIndex(p => p.id === id));
  bindFeedScrollOnce();
  renderFeedAround(targetIdx);
  viewer.hidden = false;
  viewer.scrollTop = 0;
}

async function shareFavorites() {
  const ids = [...$('favList').querySelectorAll('.pick-input:checked')].slice(0, 5).map(i => i.dataset.id);
  if (!ids.length) { showToast('Отметьте точки — какие карточки отправить'); return; }
  const favs = ids.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
  const line = p => `${pName(p)} — ${fmtPrice(p.price)} ₸`;
  const text = favs.length === 1
    ? `Detsky Hit — ${line(favs[0])}`
    : 'Detsky Hit — мой список:\n' + favs.map((p, i) => (i + 1) + '. ' + line(p)).join('\n');

  const files = [];
  if (window.__shareCardImage) {
    for (const p of favs) {
      try {
        const blob = await window.__shareCardImage(p, '');
        if (blob) files.push(new File([blob], 'detsky-hit-' + (p.article || p.id) + '.png', { type: 'image/png' }));
      } catch (e) { /* skip */ }
    }
  }

  const shareData = { title: 'Detsky Hit — мой список', text, files };
  try {
    if (navigator.canShare && navigator.canShare(shareData)) {
      await navigator.share(shareData);
      return;
    }
    if (navigator.share) {
      await navigator.share({ title: shareData.title, text });
      return;
    }
  } catch (err) { /* fall back */ }

  const box = document.createElement('textarea');
  box.value = text;
  box.readOnly = true;
  box.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(box);
  box.select(); box.setSelectionRange(0, 99999);
  try { const ok = document.execCommand('copy'); showToast(ok ? 'Список скопирован' : 'Выделите текст в окне'); }
  catch (e) { showToast('Не получилось поделиться'); }
  box.remove();
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) { /* fall through to execCommand */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
  ta.remove();
  if (!ok) throw new Error('copy failed');
  return true;
}
