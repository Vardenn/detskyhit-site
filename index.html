const THEME_COLOR = { light: '#ffffff', gray: '#d8d8dc', dark: '#000000' };
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));
  try { localStorage.setItem('dh-theme', t); } catch (e) {}
  const m = document.querySelector('meta[name="theme-color"]');

}
{

function productMeta() { return parseJSON(SETTINGS.product_meta, {}); }

  const enabled = new Set(seasonsEnabled());
  const meta = productMeta();
  return PRODUCTS.filter(p => {
    const m = meta[p.id] || {};
    if (m.active === false) return false;
    const season = m.season === undefined ? 'зима' : m.season;
    if (!season) return true;
    return enabled.has(season);
  });
}

function getFavs() { try { return JSON.parse(localStorage.getItem(FAVS_KEY) || '[]'); } catch { return []; } }
function setFavs(a) { localStorage.setItem(FAVS_KEY, JSON.stringify(a)); }
function favBadgeUpdate() { const n = getFavs().length; const b = $('favBadge'); b.hidden = n === 0; b.textContent = n; }
function fmtPrice(p) { const n = Number(String(p).replace(/\D/g, '')); return isFinite(n) && n > 0 ? n.toLocaleString('ru-RU') + ' ₸' : String(p || ''); }

function renderTop() {
  $('bio').textContent = SETTINGS.bio || '';

  $('stFollowers').textContent = SETTINGS.instagram_followers || '0';
  fetch('/api/insta-stats')

const gridEl = $('grid');
let curCat = 'all';
const filtered = () => { const base = visibleProducts(); return curCat === 'all' ? base : base.filter(p => p.category === curCat); };
const thumbOf = p => { if (!p) return ''; if (/^https?:\/\//i.test(p)) return p; const base = p.split('/').pop(); return 'thumbs/' + base.replace(/\.(jpg|jpeg|png|webp)$/i, '.jpg'); };

function renderHlbar() {
  const nav = $('hlbar');
  const visible = visibleProducts();
  const counts = {};
  for (const p of visible) counts[p.category] = (counts[p.category] || 0) + 1;
  const order = circleOrder();
  const byKey = Object.fromEntries(CAT_FILTER.map(([k, l, img]) => [k, [k, l, img]]));
  nav.innerHTML = order
    .map(k => byKey[k])
    .filter(Boolean)
    .filter(([k]) => k === 'all' ? visible.length > 0 : (counts[k] || 0) > 0)
    .map(([k, l, img]) => `<button class="hl${k === curCat ? ' active' : ''}" data-cat="${k}"><span class="hl-circle"><img src="${img}" alt="${l}"></span><span>${l}</span></button>`)
    .join('');
  nav.querySelectorAll('.hl').forEach(b => b.addEventListener('click', () => {
    curCat = b.dataset.cat;
    nav.querySelectorAll('.hl').forEach(x => x.classList.toggle('active', x === b));
    renderGrid();
  }));
  // if current category was filtered out, reset to All
  if (!nav.querySelector('.hl.active')) curCat = 'all';
}

function renderGrid() {
  const list = filtered();
  const favs = getFavs();
  if (!list.length) { gridEl.innerHTML = '<div class="empty"><b>Пока пусто</b>Скоро добавим товары</div>'; return; }
  gridEl.innerHTML = list.map(p => `
    <div class="tile" data-id="${esc(p.id)}">
      <img src="${esc(thumbOf(p.images?.[0] || ''))}" loading="lazy" decoding="async" alt="${esc(p.title || p.article)}">
      <button class="fav-btn-tile" data-id="${esc(p.id)}" aria-label="В избранное">${favs.includes(p.id) ? HEART_RED : HEART_WHITE}</button>
      <span class="mocktag">${fmtPrice(p.price)}</span>
    </div>`).join('');
}
gridEl.addEventListener('click', e => {
  const fav = e.target.closest('.fav-btn-tile');
  if (fav) {
    e.stopPropagation();
    let favs = getFavs();
    if (favs.includes(fav.dataset.id)) favs = favs.filter(x => x !== fav.dataset.id); else favs.push(fav.dataset.id);
    setFavs(favs); favBadgeUpdate(); renderGrid(); return;
  }
  const tile = e.target.closest('.tile'); if (!tile) return;
  openViewer(tile.dataset.id);
});

const viewer = $('viewer');

function openViewer(id) {

        ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}

    </article>`;
  const msg = encodeURIComponent(`Здравствуйте! Интересует: ${p.title || p.article} (${fmtPrice(p.price)}), арт. ${p.article}`);
  $('waBtn').href = 'https://wa.me/' + String(SETTINGS.whatsapp).replace(/\D/g, '') + '?text=' + msg;
  $('favBtn').addEventListener('click', () => {
    let favs = getFavs();
    if (favs.includes(p.id)) favs = favs.filter(x => x !== p.id); else favs.push(p.id);
    setFavs(favs); $('favHeart').innerHTML = favs.includes(p.id) ? HEART_RED : HEART_WHITE;
    $('favCnt').textContent = favs.length; favBadgeUpdate();

  const slider = $('car-' + p.id);
  if (slider) slider.addEventListener('scroll', () => {
    const idx = Math.round(slider.scrollLeft / slider.clientWidth);
    slider.parentElement.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === idx));
  });
  viewer.hidden = false;
}

$('showFavBtn').addEventListener('click', () => {
  const ids = getFavs();

$('favShare').addEventListener('click', shareFavorites);
async function shareFavorites() {
  const ids = [...$('favList').querySelectorAll('.pick-input:checked')].slice(0, 5).map(i => i.dataset.id);
  if (!ids.length) { showToast('Отметьте точки — какие карточки отправить'); return; }
  const favs = ids.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
  const origin = location.origin;
  const cards = favs.map((p, i) => {
    const photos = (p.images || []).map(img => (img.startsWith('http') ? img : origin + '/' + img)).join('\n');
    const sizesLine = p.sizes && p.sizes.length ? '\nРазмеры: ' + p.sizes.join(', ') : '';
    return `${i + 1}. ${p.title || p.id} (арт. ${p.article})\nЦена: ${fmtPrice(p.price)}${sizesLine}\n${photos}`;
  }).join('\n\n');
  const text = `🧥 Detsky Hit — мой список\n${cards}`;
  try {
    if (navigator.share) { await navigator.share({ title: 'Detsky Hit', text }); return; }
  } catch (err) { /* пользователь закрыл окно или браузер не поддерживает */ }
  // fallback: выделение текста + execCommand
  const box = document.createElement('textarea');
  box.value = text;
  box.readOnly = true;
  box.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(box);
  box.focus(); box.select(); box.setSelectionRange(0, 99999);
  try {
    const ok = document.execCommand('copy');
    showToast(ok ? 'Список скопирован' : 'Выделите текст в окне');
  } catch (e3) {
    showToast('Не получилось поделиться');
  }
  document.body.removeChild(box);
}
